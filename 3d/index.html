<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GLB Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: #111;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas-container {
            width: 50vw;
            height: 50vh;
            border: 2px solid #555;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>

    <!-- Three.js core -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- GLTF Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const container = document.getElementById("canvas-container");

        /* ========= Scene ========= */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1d22);
        const clock = new THREE.Clock();


        /* ========= Camera ========= */
        const camera = new THREE.PerspectiveCamera(
            45,
            container.clientWidth / container.clientHeight,
            0.01,
            1000
        );

        /* ========= Renderer ========= */
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            logarithmicDepthBuffer: true
        });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        /* ========= Controls ========= */
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;

        /* ========= Lighting (model-friendly) ========= */
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(5, 10, 7);
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 1.0);
        rimLight.position.set(-5, 5, -5);
        scene.add(rimLight);

        /* ========= GLTF Loader ========= */
        const loader = new THREE.GLTFLoader();
        let model;
        loader.load("model3.glb", (gltf) => {
            model = gltf.scene;
            scene.add(model);

            /* ===== Compute bounds ===== */
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            /* ===== Center model at origin ===== */
            model.position.sub(center);

            model.traverse((obj) => {
                if (obj.isMesh) {
                    console.log("Mesh:", obj.name, "Material:", obj.material?.name);
                }




            });


            model.traverse(o => {
                if (o.isSkinnedMesh && o.morphTargetDictionary) {
                    console.log('morphTargetDictionary', o.name, Object.keys(o.morphTargetDictionary));
                }
            });

            gltf.animations.forEach((clip, i) => {
                console.log(i, clip.name, "duration:", clip.duration);
            });


            /* ===== Get bounding sphere ===== */
            const sphere = box.getBoundingSphere(new THREE.Sphere());
            const radius = sphere.radius;

            /* ===== Camera distance based on FOV ===== */
            const fov = THREE.MathUtils.degToRad(camera.fov);
            const distance = radius / Math.sin(fov / 2);

            camera.position.set(0, radius * 0.6, distance * 1.1);

            /* ===== Adjust clipping planes ===== */
            camera.near = distance / 100;
            camera.far = distance * 100;
            camera.updateProjectionMatrix();

            /* ===== Controls focus ===== */
            controls.target.set(0, radius * 0.4, 0);
            controls.update();

            console.log("Model auto-fitted ✔");
        });

        /* ========= Resize ========= */
        window.addEventListener("resize", () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });


        /* ========= Render Loop ========= */
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            controls.update();

            renderer.render(scene, camera);
        }

        animate();
    </script>


</body>

</html>
