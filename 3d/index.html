<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLB Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #111;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-container {
      width: 50vw;
      height: 50vh;
      border: 2px solid #555;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Three.js core -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<!-- GLTF Loader -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<script>
  const container = document.getElementById("canvas-container");

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  // Camera
  const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.1,
    100
  );
  camera.position.set(0, 1.2, 1.2);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  // Orbit controls (mouse move)
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.update();


  // Light
// ===== Studio Lighting =====

// Key light (main)
const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);

// Fill light (soften shadows)
const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
fillLight.position.set(-2, 2, 3);
scene.add(fillLight);

// Back light (rim light)
const backLight = new THREE.DirectionalLight(0xffffff, 1.6);
backLight.position.set(0, 3, -3);
scene.add(backLight);

  // Load GLB
  const loader = new THREE.GLTFLoader();
loader.load("human.glb", function (gltf) {
  const model = gltf.scene;
  scene.add(model);

  // ===== Auto-center & auto-scale =====
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  // Center model at origin
  model.position.sub(center);

  // Scale to human height (~1.7 units)
  const targetHeight = 2.2;
  const scale = targetHeight / size.y;
  model.scale.setScalar(scale);

  // Adjust camera to look at model
  camera.position.set(0, 1.2, 1.2);

  // Make orbit controls focus the model
controls.target.copy(center);
controls.update();
});


  // Resize handling
  window.addEventListener("resize", () => {
    const w = container.clientWidth;
    const h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  // Render loop
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
